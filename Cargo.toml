[workspace]
resolver = "3"
members = ["native/cameras", "native/publisher", "native/recorder", "native/frames", "native/invite"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
needless_pass_by_ref_mut = "warn"
todo = "deny"
unimplemented = "deny"
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
missing_panics_doc = "allow"

[profile.dev.package.cameras]
opt-level = 3

[profile.dev.package.image]
opt-level = 2

[profile.dev]
debug = "line-tables-only"

# Keep unwinding for reusable libraries; optimize shipped native tools.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
