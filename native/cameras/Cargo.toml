[package]
name = "cameras"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Published 2026-10-23; keep capture backend changes deliberate.
nokhwa = { version = "=0.10.10", default-features = false }
thiserror = "2"
yuv = "0.8.20"

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "=0.10.10", default-features = false, features = ["input-v4l"] }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "=0.10.10", default-features = false, features = ["input-avfoundation"] }
# 0.2.4 changes the callback signature and does not compile with nokhwa 0.10.10.
nokhwa-bindings-macos = "=0.2.3"

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "=0.10.10", default-features = false, features = ["input-msmf"] }
# 0.4.6 changed raw_bytes incompatibly with nokhwa 0.10.10.
nokhwa-bindings-windows = "=0.4.5"

[lints]
workspace = true
