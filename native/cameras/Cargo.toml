[package]
name = "cameras"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false
description = "Native USB and webcam capture for Rust camera streaming applications"
repository = "https://github.com/Hebbian-Robotics/livekit-cameras"
keywords = ["camera", "webcam", "video", "capture", "robotics"]
categories = ["multimedia::video"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Update platform backend pins together and verify them on the native CI matrix.
nokhwa = { version = "=0.10.11", default-features = false }
thiserror = "2"
yuv = "0.8.20"

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-v4l"] }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-avfoundation"] }
nokhwa-bindings-macos = "=0.2.4"

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-msmf"] }
nokhwa-bindings-windows = "=0.4.6"

[lints]
workspace = true

[package.metadata.cargo-machete]
# Pins the Windows backend used transitively by nokhwa; update platform backend pins together.
ignored = ["nokhwa-bindings-windows"]
