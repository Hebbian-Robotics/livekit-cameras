[package]
name = "livekit-camera-frames"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false
description = "Latest-frame camera snapshots from native devices and LiveKit rooms"
repository = "https://github.com/Hebbian-Robotics/livekit-cameras"
keywords = ["livekit", "camera", "snapshot", "video", "robotics"]
categories = ["multimedia::video"]

[dependencies]
cameras = { path = "../cameras" }
livekit = { version = "=0.9.7", features = ["rustls-tls-native-roots"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

[lints]
workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
