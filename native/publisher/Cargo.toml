[package]
name = "livekit-camera-publisher"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[dependencies]
cameras = { path = "../cameras" }
clap = { version = "4.6.7", features = ["derive", "env"] }
livekit = { version = "=0.9.7", features = ["rustls-tls-native-roots"] }
# This SDK release requires the matching signaling release.
livekit-signaling = "=0.1.7"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }

[lints]
workspace = true
