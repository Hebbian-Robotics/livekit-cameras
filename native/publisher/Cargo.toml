[package]
name = "livekit-camera-publisher"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false
description = "Publish native USB camera video to LiveKit rooms from Rust or the command line"
repository = "https://github.com/Hebbian-Robotics/livekit-cameras"
keywords = ["livekit", "webrtc", "camera", "streaming", "robotics"]
categories = ["multimedia::video"]

[dependencies]
cameras = { path = "../cameras" }
clap = { version = "4.6.7", features = ["derive", "env"] }
livekit = { version = "=0.11.0", features = ["rustls-tls-native-roots"] }
# This SDK release requires the matching signaling release.
livekit-signaling = "=0.2.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# Pins the signaling release required by the LiveKit SDK; it is used transitively.
ignored = ["livekit-signaling"]
