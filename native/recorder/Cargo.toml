[package]
name = "livekit-camera-recorder"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[dependencies]
cameras = { path = "../cameras" }
chrono = "0.4"
livekit = { version = "=0.9.7", features = ["rustls-tls-native-roots"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[lints]
workspace = true
